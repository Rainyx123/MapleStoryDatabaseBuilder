<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>楓之谷角色資料庫</title>
    <link rel="stylesheet" href="style.css">
</head>
<body class="font-base">
    <header class="header">
        <div class="header-top">
            <div class="logo">🍁 MSDB</div>
            <div class="header-actions">
                <button id="btn-search" class="icon-btn">🔍 查詢</button>
                <button id="btn-settings" class="icon-btn">⚙️ 設定</button>
            </div>
        </div>
        <div id="tabs-container" class="tabs">
            <span class="loading-text">讀取角色資料中...</span>
        </div>
    </header>

    <main id="character-content" class="container">
        </main>

    <div id="tooltip" class="tooltip hidden"></div>

    <div id="settings-modal" class="modal hidden">
        <div class="modal-content">
            <div class="modal-header">
                <h3>顯示設定</h3>
                <button id="close-settings" class="close-btn">&times;</button>
            </div>
            <div class="modal-body">
                <div class="settings-group">
                    <span class="settings-group-title">進階功能</span>
                    <label>
                        <input type="checkbox" id="toggle-peak-power"> 
                        <span class="highlight-text">顯示 7 日最高戰力</span>
                    </label>
                </div>
                <hr>
                <div class="settings-group">
                    <span class="settings-group-title">顯示區塊開關</span>
                    <div id="section-toggles" class="toggle-grid">
                        <label><input type="checkbox" value="stat" checked> 核心屬性</label>
                        <label><input type="checkbox" value="hyper_stat" checked> 極限屬性</label>
                        <label><input type="checkbox" value="ability" checked> 內在潛能</label>
                        <label><input type="checkbox" value="equipment" checked> 裝備</label>
                        <label><input type="checkbox" value="symbol" checked> 符文系統</label>
                        <label><input type="checkbox" value="vmatrix" checked> 五轉 V-Matrix</label>
                        <label><input type="checkbox" value="hexamatrix" checked> 六轉 HEXA</label>
                        <label><input type="checkbox" value="link_skill" checked> 傳授技能</label>
                        <label><input type="checkbox" value="union" checked> 戰地聯盟</label>
                        <label><input type="checkbox" value="artifact" checked> 聯盟神器</label>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <div id="query-modal" class="modal hidden">
        <div class="modal-content">
            <div class="modal-header">
                <h3>即時查詢</h3>
                <button id="close-query" class="close-btn">&times;</button>
            </div>
            <div class="modal-body">
                <input type="text" id="query-input" placeholder="輸入角色名稱...">
                <button id="btn-submit-query">查詢</button>
                <div id="query-result-msg" class="msg-box hidden"></div>
            </div>
        </div>
    </div>

    <script type="module" src="app.js"></script>
</body>
</html>
