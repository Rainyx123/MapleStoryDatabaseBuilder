<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>🍁 楓之谷角色資料庫</title>
  <link rel="stylesheet" href="style.css">
  <link rel="icon" href="data:image/x-icon;base64,AAABAAEAEBAAAAEAIABoBAAAFgAAACgAAAAQAAAAIAAAAAEAIAAAAAAAAAAAABMLAAATCwAAAAAAAAAAAAD///8A8PDwAPDw8AD///8A">
</head>
<body>

  <header id="header">
    <div id="logo">🍁 楓之谷DB</div>
    <div id="tab-bar"></div>
    <div id="header-actions">
      <button id="btn-query" title="即時查詢">🔍</button>
      <button id="btn-settings" title="顯示設定">⚙️</button>
    </div>
  </header>

  <main id="main">
    <div id="loading"><div class="spinner"></div><p>讀取角色資料中...</p></div>

    <div id="content" class="hidden container-stack">

      <!-- =========================================================
           角色總覽（v6 棋盤總覽版）
           5 個區塊為扁平的直接子元素，由 style.css 的 #overview-row
           以 CSS Grid 排列位置（桌面：左欄極限屬性/內在潛能/傳授技能
           依 2:3:1 比例疊放、中欄角色與裝備、右欄核心屬性；
           窄螢幕收合為單欄堆疊，順序見 style.css RWD 區塊）。
           每個區塊仍各自保留獨立收合功能（沿用既有 .section-header 收合機制）。
      ========================================================== -->
      <div class="overview-row" id="overview-row">

        <section class="section-card" id="section-hyper">
          <div class="section-header"><span>極限屬性</span><span class="toggle-icon">▼</span></div>
          <div class="section-body" id="hyper-list"></div>
        </section>

        <section class="section-card" id="section-ability">
          <div class="section-header"><span>內在潛能</span><span class="toggle-icon">▼</span></div>
          <div class="section-body" id="ability-list"></div>
        </section>

        <section class="section-card" id="section-link">
          <div class="section-header"><span>傳授技能</span><span class="toggle-icon">▼</span></div>
          <div class="section-body grid-link" id="link-grid"></div>
        </section>

        <section class="section-card" id="section-equip">
          <div class="section-header"><span>角色與裝備</span><span class="toggle-icon">▼</span></div>
          <div class="section-body">
            <!-- 頂部資訊列：角色名稱／職業／等級／戰鬥力／伺服器／戰地聯盟／聯盟等級 -->
            <div class="char-info-bar">
              <span class="info-name" id="char-name"></span>
              <span class="info-item" id="char-class"></span>
              <span class="info-item" id="char-level"></span>
              <span class="info-item info-cp">戰鬥力 <b id="char-combat-power">—</b></span>
              <span class="info-item" id="char-server"></span>
              <span class="info-item" id="char-union-grade"></span>
              <span class="info-item" id="char-union-level"></span>
            </div>
            <!-- 裝備棋盤格（含中央角色圖），內容由 app.js 的 renderEquipment() 動態產生 -->
            <div class="equip-doll-grid" id="equip-doll-grid"></div>
          </div>
        </section>

        <section class="section-card" id="section-stats">
          <div class="section-header"><span>核心屬性</span><span class="toggle-icon">▼</span></div>
          <div class="section-body grid-stats" id="stat-grid"></div>
        </section>

      </div>

      <!-- =========================================================
           聯盟與技能系統：左右兩欄配對排列
           （聯盟冠軍↔符文系統、聯盟神器↔六轉Hexa）
      ========================================================== -->
      <div class="grid-system">
        <div class="flex-column-layout span-4">
          <section class="section-card" id="section-champion">
            <div class="section-header"><span>聯盟冠軍</span><span class="toggle-icon">▼</span></div>
            <div class="section-body grid-champion" id="union-champion-grid"></div>
          </section>
          <section class="section-card" id="section-artifact">
            <div class="section-header"><span>聯盟神器</span><span class="toggle-icon">▼</span></div>
            <div class="section-body grid-artifact" id="union-artifact-grid"></div>
          </section>
        </div>

                <!-- =========================================================
             外觀區+聯盟攻擊隊：棋盤格版位（戒指/臉飾/眼飾/耳環/帽子/披風/上衣/手套/
             褲子/鞋子/武器/副武 ＋ 中央角色圖、最下排髮型/臉型/膚色）、戰地攻擊隊↔六轉HEXA
        ========================================================== -->
        <div class="flex-column-layout span-4">
          <section class="section-card" id="section-appearance">
            <div class="section-header"><span>外觀區</span><span class="toggle-icon">▼</span></div>
            <div class="section-body">
              <div class="appearance-doll-grid" id="appearance-doll-grid"></div>
            </div>
          </section>
          <section class="section-card" id="section-raider">
            <div class="section-header"><span>戰地攻擊隊</span><span class="toggle-icon">▼</span></div>
            <div class="section-body grid-unionraider" id="union-raider-grid"></div>
          </section>
        </div>
        
        <div class="flex-column-layout span-4">
          <section class="section-card" id="section-symbol">
            <div class="section-header"><span>符文系統 (ARC/AUT)</span><span class="toggle-icon">▼</span></div>
            <div class="section-body">
              <div class="grid-symbol" id="symbol-grid"></div>
              <div class="symbol-summary" id="symbol-summary"></div>
            </div>
          </section>
          <section class="section-card" id="section-hexa">
            <div class="section-header"><span>六轉 HEXA</span><span class="toggle-icon">▼</span></div>
            <div class="section-body grid-hexa" id="hexa-grid"></div>
          </section>
          <section class="section-card" id="section-v">
            <div class="section-header"><span>五轉 V-Matrix</span><span class="toggle-icon">▼</span></div>
            <div class="section-body grid-vmatrix" id="v-grid"></div>
          </section>
        </div>
      </div>

      <!-- =========================================================
           寵物：保留獨立卡片，固定置於頁面最下方
      ========================================================== -->
      <div class="grid-system">
        <section class="section-card span-12" id="section-pets">
          <div class="section-header"><span>寵物</span><span class="toggle-icon">▼</span></div>
          <div class="section-body grid-pet" id="pets-grid"></div>
        </section>
      </div>

    </div>
  </main>

  <div id="tooltip" class="hidden"></div>

  <!-- 提示訊息容器（取代原本的 alert()，由 app.js 動態插入 .toast 元素） -->
  <div id="toast-container"></div>

  <div id="modal-settings" class="modal hidden">
    <div class="modal-box">
      <div class="modal-header"><h2>⚙️ 設定</h2><button onclick="closeModal('modal-settings')">✕</button></div>
      <div class="modal-body">
        <div class="settings-group-title">顯示區塊</div>
        <label><input type="checkbox" data-section="section-stats" checked> 核心屬性</label>
        <label><input type="checkbox" data-section="section-hyper" checked> 極限屬性</label>
        <label><input type="checkbox" data-section="section-equip" checked> 角色與裝備</label>
        <label><input type="checkbox" data-section="section-ability" checked> 內在潛能</label>
        <label><input type="checkbox" data-section="section-link" checked> 傳授技能</label>
        <label><input type="checkbox" data-section="section-champion" checked> 聯盟冠軍</label>
        <label><input type="checkbox" data-section="section-raider" checked> 戰地攻擊隊</label>
        <label><input type="checkbox" data-section="section-artifact" checked> 聯盟神器</label>
        <label><input type="checkbox" data-section="section-symbol" checked> 符文系統</label>
        <label><input type="checkbox" data-section="section-hexa" checked> 六轉 HEXA</label>
        <label><input type="checkbox" data-section="section-v" checked> 五轉 V-Matrix</label>
        <label><input type="checkbox" data-section="section-appearance" checked> 外觀區</label>
        <label><input type="checkbox" data-section="section-pets" checked> 寵物</label>
        <hr>
        <label><input type="checkbox" id="toggle-peak"> 顯示 7 日最高戰力</label>
      </div>
    </div>
  </div>

  <div id="modal-query" class="modal hidden">
    <div class="modal-box">
      <div class="modal-header"><h2>🔍 查詢</h2><button onclick="closeModal('modal-query')">✕</button></div>
      <div class="modal-body">
        <input type="text" id="query-input" placeholder="角色名稱...">
        <button id="btn-query-submit">查詢</button>
        <div id="query-status"></div>
      </div>
    </div>
  </div>

  <script src="app.js" defer></script>
</body>
</html>
